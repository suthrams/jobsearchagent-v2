# ─── Job Search Agent v2 — Example Configuration ─────────────────────────────
# Copy this file to config/config.yaml and fill in your preferences.
# config.yaml is gitignored — this file is safe to commit.
#
# Per-profile overrides (ADR-062) layer on top of these defaults via the Settings
# UI and are stored in the user_config table; a new profile starts on pure
# defaults until it sets its own.

# ─── Search Preferences ───────────────────────────────────────────────────────
# search.titles is the keyword set that drives Adzuna scraping and pre-fills the
# Start New Run form; search.locations pre-fills the run form's locations.
search:
  titles:
    - Senior Software Engineer
    - Staff Engineer
    - Principal Engineer
    - Solutions Architect
    - Principal Architect
    - Director of Engineering
    - Head of Engineering
  locations:
    - Atlanta, GA
    - Remote

  # ADR-065: per-profile experience targeting (optional; usually set per profile
  # via the Settings/Start New Run UI rather than here). Off by default.
  # max_years_experience: 2   # drop postings asking for MORE than N years (0 = off)
  # min_years_experience: 5    # drop postings asking for FEWER than N years (0 = off)
  # exclude_senior: true       # drop senior/principal/staff/lead/director/etc.

  # ADR-079: opt-in reasoning relevance pre-filter. When true, discovery casts the
  # wider net and ONE cheap LLM pass drops jobs that are a clear seniority or role
  # mismatch BEFORE scoring (saves the 2 scoring calls/job on the noise). Judged
  # relative to the profile's own band, so it drops too-senior roles for an
  # early-career profile and too-junior roles for a senior one. Off by default.
  # relevance_filter: true

  # ADR-094: opt-in security-clearance exclusion, folded INTO the relevance filter.
  # When true AND relevance_filter is on, postings requiring a US/government clearance
  # (TS/SCI, Secret, polygraph, DoD, ...) are dropped before scoring. Deterministic
  # keyword match - no extra LLM cost. No effect unless relevance_filter is on. Off by
  # default so cleared candidates keep cleared roles.
  # exclude_clearance: true

  # ADR-080: opt-in max posting age. Drop postings older than N days at discovery
  # (upstream of the relevance filter AND scoring). Stale postings correlate with
  # pulled requisitions / dead apply links. Postings with no parseable date are
  # kept. 0/absent = off. Deterministic, no network fetch.
  # max_posting_age_days: 30

  # ADR-095: opt-in best-effort dead-link filter. When true, discovery checks each
  # apply link and drops postings that are VERIFIABLY dead (HTTP 404/410 or a 200 page
  # with a "no longer available" marker). Conservative: keeps the job on any timeout /
  # 429 / connection error / DNS failure (never lose a job to a transient signal).
  # Network I/O - adds a bounded web request per job - so off by default.
  # drop_dead_links: true

# ─── Scoring ────────────────────────────────────────────────────────────────
# Usually set per profile via the Settings UI (writes to user_config), not here.
scoring:
  # ADR-071: active scoring tracks — the subset of the three career tracks this
  # profile pursues. Inactive tracks are NOT scored, do not gate deep review, and
  # are hidden in the UI. Omit (or list all three) to score all tracks like the
  # Primary profile. Valid names: ic (technical), architect (architecture),
  # management (leadership).
  tracks:
    - ic
    - architect
    - management
  # career_track: all   # weighting emphasis among the active tracks (ic | architect
  #                     # | management | all). Distinct from `tracks` (inclusion).
  # min_match_score: 75 # any active track >= this triggers deep review.
  # auto_interview_prep: false  # ADR-085: interview prep is on-demand by default
  #                     # (POST .../interview-prep). Set true to auto-run the
  #                     # in-graph coach when a selected job clears min_match_score.

# ─── Job Sources ──────────────────────────────────────────────────────────────
# Adzuna (AdzunaConfig). Quota guard: len(search.titles) x len(locations)
# + len(remote_keywords) must stay < 100/day.
scrapers:
  adzuna:
    enabled: true
    country: us
    locations:
      - Atlanta, GA
    radius_km: 80
    results_per_page: 25   # 25/call. Adzuna free tier maxes at 50; 25 is the
                           # post-2026-05-29 default after the senior-exclude tuning.
    # Remote search — no location filter, "remote" appended to each keyword.
    remote_keywords:
      - software architect
      - principal engineer
      - solutions architect

  # ADR-081: ATS-direct sources (source-of-truth). Listings are live by definition
  # and the apply URL is the employer's own ATS page — so no dead-link / 429 issue
  # (unlike Adzuna). Queried PER COMPANY: list the board tokens / slugs of your
  # target companies (empty list = off). Title relevance uses the run's roles.
  # Find a token from the careers URL: Greenhouse `boards.greenhouse.io/<token>`,
  # Lever `jobs.lever.co/<slug>`.
  greenhouse:
    enabled: true
    companies: []   # e.g. [stripe, figma, anthropic]
  lever:
    enabled: true
    companies: []   # e.g. [leverdemo]

# ═══════════════════════════════════════════════════════════════════════════════
# v2 Configuration (ADR-053 + ADR-058)
# ═══════════════════════════════════════════════════════════════════════════════

# ─── v2 Data Retention ───────────────────────────────────────────────────────
# Windows for the explicit purge (app.repositories.database.purge_old_data).
# Purge is always manual — never runs automatically (POST /admin/purge or
# tools/purge_data.py). Omit any key for the default. ADR-070: purging a
# workflow_runs row cascades to ALL its child rows; resumes are purged on their
# own window and only when inactive AND no longer referenced by a surviving run.
retention:
  workflow_runs_days: 90
  observability_days: 30
  security_events_days: 180
  memory_items_days: 365
  jobs_days: 90
  resumes_days: 365

# ─── v2 Per-Agent Model Assignment (ADR-053 + ADR-058) ───────────────────────
# Each agent's default (provider, model). Per-profile overrides via the Settings
# UI write to the user_config DB table and merge over these defaults.
#
# Cost-capped agents (research_agent, scoring_agent) cannot be assigned a model
# outside the HIGH_VOLUME_SAFE_MODELS allowlist in app/providers/model_registry.py.
# That allowlist is a policy boundary enforced in code — it is NOT configuration.
agents:
  research_agent:       {provider: claude, model: claude-haiku-4-5-20251001}
  scoring_agent:        {provider: claude, model: claude-haiku-4-5-20251001}
  relevance_filter:     {provider: claude, model: claude-haiku-4-5-20251001}   # ADR-079 pre-scoring filter; one cheap batched call/run
  resume_critic:        {provider: claude, model: claude-haiku-4-5-20251001}
  review_auditor:       {provider: claude, model: claude-haiku-4-5-20251001}
  fidelity_reviewer:    {provider: claude, model: claude-haiku-4-5-20251001}
  career_advisor:       {provider: claude, model: claude-sonnet-4-6}
  interview_coach:      {provider: claude, model: claude-sonnet-4-6}
  tailoring_agent:      {provider: claude, model: claude-sonnet-4-6}
  resume_parser:        {provider: claude, model: claude-sonnet-4-6}
  custom_url_extractor: {provider: claude, model: claude-sonnet-4-6}
  resume_reviewer:      {provider: claude, model: claude-sonnet-4-6}   # ADR-066 Resume Clinic; low-volume, quality-sensitive
  resume_chat:          {provider: claude, model: claude-haiku-4-5-20251001}   # ADR-068 chat-revise; ADR-092 Haiku for cost (schema-validated 2026-06-08; ~5x cheaper than sonnet)

# ─── v2 Model Catalog + Pricing (ADR-058) ────────────────────────────────────
# The catalog of registered (provider, model) pairs and their per-million-token
# pricing in USD. Editing this file is how the system learns about new models or
# prices — no code release required.
#
# Validation: ConfigService validates this block on load. Any agent assigned above
# must reference a (provider, model) pair listed here. Provider class dispatch is
# in code (ModelRegistry._build_provider); adding a new provider (not a new model)
# still requires a provider implementation.
models:
  providers:
    claude:
      - {id: claude-haiku-4-5-20251001, input_per_m: 1.00,  output_per_m: 5.00}
      - {id: claude-sonnet-4-6,         input_per_m: 3.00,  output_per_m: 15.00}
      - {id: claude-opus-4-8,           input_per_m: 5.00,  output_per_m: 25.00}
    openai:
      # TODO: refresh against the current OpenAI pricing page when the catalog is
      # reviewed. The 2024 models below are stale; o1 was superseded by o3.
      - {id: gpt-4o-mini, input_per_m: 0.15,  output_per_m: 0.60}
      - {id: gpt-4o,      input_per_m: 2.50,  output_per_m: 10.00}
      - {id: o1,          input_per_m: 15.00, output_per_m: 60.00}
